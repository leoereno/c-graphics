name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libfribidi-dev libdrm-dev libdecor-0-dev

    - name: Setup SDL3
      uses: libsdl-org/setup-sdl@v1
      with:
        version: 3-head # Instala a versão mais recente do SDL3

    - name: Run Makefile
      run: make build
